<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMKM Manager | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <h1>Masuk ke akun Anda</h1>
    <p class="subtitle">Kelola keuangan dan stok usaha Anda di satu tempat.</p>

    <form id="loginForm">
      <label for="username">Email / Username</label>
      <input type="text" id="username" name="username" placeholder="Masukkan email atau username" autocomplete="off" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Masukkan password" required>

      <p id="errorMsg" class="error-msg"></p>

      <button type="submit">Masuk</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
